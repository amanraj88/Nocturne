name: Cleanup Stale Rooms

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  # Enable manual execution on-demand from the GitHub Actions tab
  workflow_dispatch:

jobs:
  cleanup:
    name: Prune Inactive Rooms
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cleanup Endpoint
        run: |
          TARGET_URL="${{ secrets.NOCTURNE_URL || 'https://nocturne-steel-xi.vercel.app' }}"
          echo "Triggering room cleanup at ${TARGET_URL}/api/rooms/cleanup"
          curl --fail --show-error --silent \
            -X POST "${TARGET_URL}/api/rooms/cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
